# Configuracion por defecto para proyectos que usan devin-agents
agents_repo: https://github.com/<tu-cuenta>/devin-agents
default_profile: java-spring-boot

enabled_agents:
  - backend
  - testing
  - devops
  - qa

stack_detection:
  files:
    - name: pom.xml
      profile: java-spring-boot
    - name: build.gradle
      profile: java-spring-boot
    - name: package.json
      profile: nodejs-nestjs
    - name: requirements.txt
      profile: python-fastapi
    - name: pyproject.toml
      profile: python-fastapi
    - name: go.mod
      profile: go-gin
