# Configuracion por defecto para proyectos que usan devin-agents
agents_repo: https://github.com/<tu-cuenta>/devin-agents
default_profile: java-spring-boot

enabled_agents:
  - backend
  - testing
  - devops
  - qa

# La deteccion de stack debe inspeccionar dependencias reales, no solo nombres de archivo.
# Un mismo archivo (package.json, pyproject.toml, go.mod) puede corresponder a multiples stacks.
stack_detection:
  profiles:
    java-spring-boot:
      evidence:
        - file: pom.xml
          must_contain: spring-boot
        - file: build.gradle
          must_contain: spring-boot
    nodejs-nestjs:
      evidence:
        - file: package.json
          must_contain: "@nestjs/core"
    python-fastapi:
      evidence:
        - file: requirements.txt
          must_contain: fastapi
        - file: pyproject.toml
          must_contain: fastapi
        - file: poetry.lock
          must_contain: fastapi
    go-gin:
      evidence:
        - file: go.mod
          must_contain: github.com/gin-gonic/gin
