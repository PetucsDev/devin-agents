# Plantilla de configuracion para proyectos Java + Spring Boot
agents_repo: https://github.com/<tu-cuenta>/devin-agents
profile: java-spring-boot

enabled_agents:
  - backend
  - testing
  - devops
  - qa

project:
  name: nombre-del-proyecto
  description: Breve descripcion del proyecto
  architecture: hexagonal|layered|ddd|microservicios

# Archivos que el agente debe leer obligatoriamente antes de actuar.
verification_files:
  - README.md
  - pom.xml
  - build.gradle
  - src/main/resources/application.yml
  - src/main/resources/application.properties
